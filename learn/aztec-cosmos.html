<body data-page="lesson" data-depth="1" data-world="aztec" data-chapter="cosmos"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>阿兹特克神话 · 世界与核心观念</h1><h2>太阳时代</h2><p>多个世界轮次在灾变中终结与更新，名称、顺序和细节因纳瓦文献而异，并非单一年代学。</p><h2>米克特兰</h2><p>与特定死亡归宿相关的亡者领域，进入过程具有试炼；它并非按现代善恶观划分的惩罚地狱。</p><h2>特拉洛坎</h2><p>与雨神、水和丰饶相连的领域，在部分死后观中是特定亡者的归处，不等同所有人的天国。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
