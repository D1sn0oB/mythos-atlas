<body data-page="lesson" data-depth="1" data-world="west-africa" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>阿坎与阿南西 · 全景导读</h1><p>本条聚焦加纳及科特迪瓦一带阿坎传统中的阿南西故事，而非概括整个西非。蜘蛛讲述者以机智、贪心和失误推动情节；故事又随非洲侨民传播，在加勒比等地形成不同面貌。</p><p>“西非”只是此条的区域索引；内容专指部分阿坎材料，不代表整个西非。阿南西也不总被视为神，海外阿南西传统具有自身历史，不是原样复制。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
