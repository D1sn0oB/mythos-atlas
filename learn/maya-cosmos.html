<body data-page="lesson" data-depth="1" data-world="maya" data-chapter="cosmos"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>玛雅神话 · 世界与核心观念</h1><h2>西巴尔巴</h2><p>基切文本中的危险冥界，设有主宰与试炼之屋；不应把它当作所有玛雅语言共同的地狱名称。</p><h2>世界树意象</h2><p>玛雅艺术中连接天、地与地下的树形结构，表现中心与通道，其形态及名称因语境而不同。</p><h2>洞穴与山体</h2><p>常是水、祖先和神圣力量相遇的地点，真实地景与宇宙意义相连，并非单纯幻想中的背景。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
