<body data-page="lesson" data-depth="1" data-world="celtic" data-chapter="cosmos"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>凯尔特神话 · 世界与核心观念</h1><h2>彼岸</h2><p>爱尔兰叙事中多样的超凡领域，可在海岛、湖底或丘中显现，并非一律等同死者的归宿。</p><h2>神丘</h2><p>丘陵与古冢常被叙事视为超凡居民的居所或入口，其意义与具体地景、名称和地方记忆相连。</p><h2>人间海路</h2><p>航海叙事以熟悉的海洋连接未知世界，边界既是空间距离，也涉及知觉、时间和禁忌的改变。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
