<body data-page="lesson" data-depth="1" data-world="yoruba" data-chapter="cosmos"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>约鲁巴神话 · 世界与核心观念</h1><h2>奥伦</h2><p>常指神圣者与祖先相关的领域，与人间保持联系，并非完全隔绝的遥远天国。</p><h2>阿耶</h2><p>人们生活的大地与世界，日常行动、社群责任及神圣关系在此持续交织。</p><h2>阿舍</h2><p>使言语与行动产生效力的力量，体现于生命和关系，不宜简化为魔法能量。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
