<body data-page="lesson" data-depth="1" data-world="japan" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>日本神话 · 全景导读</h1><p>日本神话以《古事记》《日本书纪》等文本中的国土生成与诸神故事广为人知，也与神社祭祀、地方风土记和口传传统相互交织。天照大神、须佐之男与伊邪那岐的行动连接天上、海原和黄泉。诸神并非全然一致的家谱，异文与地方传统始终并存。</p><p>本条以古代编纂神话为主；神道是活态宗教实践，地方神社传统远比此处广泛。阿伊努、琉球等传统具有独立脉络，不应自动并入这套诸神叙事。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
