<body data-page="lesson" data-depth="1" data-world="christianity" data-chapter="cosmos"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>基督教传统 · 世界与核心观念</h1><h2>创造与受造界</h2><p>上帝与受造世界有所区分。自然、人类与历史被置于创造、责任与照管的关系中，各教派的解释并不完全相同。</p><h2>救赎与盼望</h2><p>围绕耶稣的生命、受难与复活理解罪、恩典和救恩，是基督教神学与礼仪的核心；细部教义随传统而异。</p><h2>新天与新地</h2><p>《启示录》等文本以象征丰富的图景描绘更新与终末盼望，不宜简单当作所有教会一致认可的事件时间表。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
