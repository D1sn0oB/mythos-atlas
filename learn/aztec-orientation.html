<body data-page="lesson" data-depth="1" data-world="aztec" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>阿兹特克神话 · 全景导读</h1><p>阿兹特克神话通常指以墨西加为核心的纳瓦传统，材料见于图画文书、殖民时期记录与考古遗存。太阳时代的更替、迁徙与建城构成重要线索，诸神也具有多重名称和显现。阅读这些故事既要正视战争与祭仪，也应避开把整个文明缩减为血腥奇观的眼光。</p><p>阿兹特克是常用统称，本条聚焦墨西加与纳瓦材料，不代表所有中美洲宗教。殖民记录受翻译与传教语境影响；当代纳瓦社群及其宗教生活仍在延续变化。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
