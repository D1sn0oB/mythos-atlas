<body data-page="lesson" data-depth="1" data-world="celtic" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>凯尔特神话 · 全景导读</h1><p>凯尔特神话是对多种语言与地域传统的统称，并非一个统一神系。本条以中世纪爱尔兰文献保存的故事为主，兼顾其口传背景。达努神族、技艺卓绝的英雄与隐现的彼岸，使土地、主权和亲缘彼此交织；威尔士等地的叙事则应在各自脉络中阅读。</p><p>凯尔特是比较性总称，本条不把爱尔兰、威尔士、布列塔尼诸传统混成一部经典。中世纪抄写者的基督教背景与早期材料相互交织，现代复兴实践也各有差别。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
