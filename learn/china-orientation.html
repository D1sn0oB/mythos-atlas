<body data-page="lesson" data-depth="1" data-world="china" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>中国神话 · 全景导读</h1><p>中国神话并非一部统一经典，而是先秦典籍、地方祭祀与历代讲述交织成的广阔谱系。从女娲补天到昆仑仙境，人、神与山川彼此感应，天地秩序也在灾变后重新建立。不同年代的记载常有分歧，民间信仰与文学改写又不断赋予古老形象新的生命。</p><p>本条兼及古代文献与后世传播，不代表中国各民族神话的总和。女娲、西王母等也属于部分地区的活态祭祀传统；文学形象、道教神谱与地方信仰须分别理解。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
