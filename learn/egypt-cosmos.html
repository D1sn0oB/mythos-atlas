<body data-page="lesson" data-depth="1" data-world="egypt" data-chapter="cosmos"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>埃及神话 · 世界与核心观念</h1><h2>努恩</h2><p>创世之前的原初水域，也作为未分化力量环绕世界；它不是某条可在地图上定位的河流。</p><h2>杜阿特</h2><p>与夜间太阳和死者旅程相关的隐秘领域，其地形在不同葬仪文本与图像中有多种安排。</p><h2>玛阿特</h2><p>兼为女神与真实、正义、适当秩序的观念，是宇宙及社会需持续实践的原则，而非地名。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
