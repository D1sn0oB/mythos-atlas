<body data-page="lesson" data-depth="1" data-world="roman" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>罗马神话 · 全景导读</h1><p>罗马神话生长在家宅仪式、国家祭祀与城市起源的叙述之中，也长期吸收并改写希腊等地的故事。诸神守护边界、誓约、农事与共同体，英雄传说则讨论建城所需的选择和代价。它不只是希腊神名的替换表，更承载了罗马人理解历史与公共秩序的方式。</p><p>本条区分拉丁文学叙事与公共、家庭宗教实践。罗马帝国境内信仰高度多样，吸收希腊、伊特鲁里亚及其他传统，不等于所有地方都遵循同一套神谱。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
