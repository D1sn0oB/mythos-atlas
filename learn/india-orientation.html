<body data-page="lesson" data-depth="1" data-world="india" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>印度神话 · 全景导读</h1><p>印度拥有众多宗教、语言与地方叙事，本条主要介绍印度教史诗和往世书中的神圣故事。诸神的化现、宇宙周期与维护正法的行动，连接日常祭祀与哲学思考。同一故事可因教派、地区和表演传统而变化，不应把印度全部信仰压缩成一套固定的众神关系。</p><p>印度教是多样的活态宗教，本条不代表佛教、耆那教及印度其他传统。诸神关系与至高观依教派而异，图鉴中的神圣故事不被预设为信众眼中的虚构。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
