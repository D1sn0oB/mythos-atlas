<body data-page="lesson" data-depth="1" data-world="japan" data-chapter="cosmos"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>日本神话 · 世界与核心观念</h1><h2>高天原</h2><p>诸天津神活动的天上领域，与地上世界发生往来；它的性质并非现代天文学意义的太空。</p><h2>苇原中国</h2><p>神话中人间国土的称谓之一，常与国土生成和让国故事相连；此处的中国并非现代国名。</p><h2>黄泉</h2><p>伊邪那美所在的死亡领域，与生者世界存在危险边界，不宜简单套用善恶报应式的地狱观。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
