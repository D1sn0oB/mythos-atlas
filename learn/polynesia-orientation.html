<body data-page="lesson" data-depth="1" data-world="polynesia" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>波利尼西亚神话 · 全景导读</h1><p>波利尼西亚诸岛拥有相互关联而不相同的语言、谱系与神圣叙事。航行、海洋和岛屿生成常是重要主题；此处主要选取毛利公开故事作例，不把各岛同源的名字视为完全相同的神明。</p><p>波利尼西亚不是单一文化。此处故事以新西兰毛利公开版本为例；夏威夷、萨摩亚、汤加、大溪地等地各有传统，名称近似不意味着身份和故事相同。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
