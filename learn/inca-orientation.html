<body data-page="lesson" data-depth="1" data-world="inca" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>印加神话 · 全景导读</h1><p>印加神话保存于殖民时期编年史、地方记忆与安第斯仪式传统之中，王室起源与库斯科的神圣地景尤为突出。太阳、山岳和大地并不只是自然背景，而是与人持续互惠的存在。印加帝国曾容纳众多族群，其国家叙事不能代表全部安第斯社群的信仰与历史。</p><p>这里区分印加国家宗教与更广的安第斯传统。今日盖丘亚、艾马拉等社群的实践各有差异，也可能与天主教交织；不能一律称作未变的印加遗存。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
