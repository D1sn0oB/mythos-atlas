<body data-page="lesson" data-depth="1" data-world="persia" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>波斯神话 · 全景导读</h1><p>波斯神话联系古代伊朗的宗教、王权与英雄叙事，其中琐罗亚斯德教经典与《列王纪》具有不同的成书背景。光明与谎言、正当选择与世界更新，是反复出现的主题。神圣存在并不都属于多神教意义的诸神，史诗英雄也不能直接等同于宗教经典中的角色。</p><p>琐罗亚斯德教至今仍是活态宗教。栏目中的诸神包含神圣者，并非强行归入多神教；《列王纪》的文学史诗与阿维斯陀宗教经典在此明确区分。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
