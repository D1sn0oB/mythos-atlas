<body data-page="lesson" data-depth="1" data-world="korea" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>韩国神话 · 全景导读</h1><p>朝鲜半岛神话见于建国传说、文献与巫俗口传，既有檀君祖源，也有神圣女性的远行。各地仪式、历史记忆与现代认同并不一致，不能把一则建国故事当作所有社群共同的信仰。</p><p>本条以朝鲜半岛传统为文化范围，不将现代国界当作古代故事边界。檀君文献与巴里巫俗史诗性质不同；巫俗、佛教及其他传统之间亦有长期交流。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
