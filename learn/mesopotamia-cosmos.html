<body data-page="lesson" data-depth="1" data-world="mesopotamia" data-chapter="cosmos"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>两河神话 · 世界与核心观念</h1><h2>阿普苏</h2><p>与地下淡水及原初存在相关，苏美尔语对应词常译阿勃祖；名称在不同文本中兼有多重意义。</p><h2>天与地</h2><p>宇宙的主要区分，也与诸神分工、城市神庙和政治秩序相连，不同时代的创世安排各不相同。</p><h2>无返之地</h2><p>冥界在许多作品中是不易返回的死者之域，其门、守卫和生活状态依文本呈现不同细节。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
