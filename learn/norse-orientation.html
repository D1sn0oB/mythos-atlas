<body data-page="lesson" data-depth="1" data-world="norse" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>北欧神话 · 全景导读</h1><p>北欧神话主要通过古诺尔斯诗歌、斯诺里的著述与考古材料为今人所知。诸神居于世界树联系的诸域，在与巨人、怪物及彼此的交涉中维系不稳固的秩序。知识往往需要牺牲，勇气也不能取消终结；而毁灭之后的再生，使宇宙并未停在最后一战。</p><p>主要书面材料由基督教化后的作者保存，不能直接视为全部维京人的统一教义。现代北欧多神信仰亦有活态社群，符文不应被自动等同极端主义符号。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
