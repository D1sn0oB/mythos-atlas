<body data-page="lesson" data-depth="1" data-world="india" data-chapter="cosmos"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>印度神话 · 世界与核心观念</h1><h2>宇宙之海</h2><p>多种创世与维系叙事以海为背景，其象征与神学意义随经典而变，并非一个固定地理空间。</p><h2>须弥山</h2><p>在多种南亚宗教宇宙观中居重要位置，各传统的层级、尺度与解释不同，不应混作同一模型。</p><h2>劫与时代</h2><p>广大的宇宙周期容纳生成、维持与消解，不同文本对时长和分期各有系统性的说明。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
