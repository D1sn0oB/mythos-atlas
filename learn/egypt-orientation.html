<body data-page="lesson" data-depth="1" data-world="egypt" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>埃及神话 · 全景导读</h1><p>古埃及神话在数千年的神庙、墓葬与仪式文本中不断变化。太阳的运行、尼罗河的滋养、王权与死后生命彼此关联，宇宙秩序需要每日维护。赫利奥波利斯、孟斐斯等地拥有不同创世传统；这些差异往往能够并存，而非等待被整理成唯一正确的神谱。</p><p>埃及神话跨越漫长时段，神名、关系与中心地位均会改变。本条不以单一王朝代表全部传统，也不把木乃伊、审判或神庙实践简化为猎奇的死亡崇拜。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
