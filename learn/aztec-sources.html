<body data-page="lesson" data-depth="1" data-world="aztec" data-chapter="sources"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>阿兹特克神话 · 原典与进阶阅读</h1><h2>《太阳传说》</h2><p>纳瓦语传承的重要记录，殖民时期的抄写与解释背景须说明。</p><h2>《佛罗伦萨手抄本》</h2><p>纳瓦受访者、写作者与殖民编纂者共同参与的复杂文本。</p><h2>《博尔吉亚手抄本》等图像材料</h2><p>图像需依文献和语境解读，不能随意套用现代解释。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
