<body data-page="lesson" data-depth="1" data-world="persia" data-chapter="cosmos"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>波斯神话 · 世界与核心观念</h1><h2>正当秩序</h2><p>阿沙关联真实、正当与宇宙秩序，既有宗教也有伦理维度，不应只化约成光明一方的阵营名。</p><h2>钦瓦特桥</h2><p>灵魂死后面对判断的重要关口，善思、善言与善行关系其归宿；不同文献的描述各有发展。</p><h2>世界更新</h2><p>最终更新使存在走向完善，是琐罗亚斯德教重要观念，其具体过程在后世文献中更为展开。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
