<body data-page="lesson" data-depth="1" data-world="christianity" data-chapter="sources"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>基督教传统 · 原典与进阶阅读</h1><h2>《创世记》第1—2章</h2><p>同属犹太教经典和基督教《旧约》，有多种释经传统。</p><h2>《路加福音》第24章／《约翰福音》第20章</h2><p>复活叙事的两个重要文本，细节与写作重点有所不同。</p><h2>不同教会的公开教理与礼仪资料</h2><p>天主教、东正教与新教传统的共同点和差异都应得到说明。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
