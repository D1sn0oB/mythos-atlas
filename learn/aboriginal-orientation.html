<body data-page="lesson" data-depth="1" data-world="aboriginal" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>澳洲原住民传统 · 全景导读</h1><p>澳大利亚原住民族拥有众多语言与土地传统，不能合并为一个神话体系。本条只介绍已公开的通识材料，强调祖先、地方与责任的联系，不涉及受限仪式、神圣图样或未经授权的知识。</p><p>本条不是统一神谱；gods栏目仅沿用界面结构，不表示这些祖先都是西式神祇。仅用公开通识，不涉及受限神圣知识，也不代表托雷斯海峡岛民的独立传统。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
