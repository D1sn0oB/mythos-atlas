<body data-page="lesson" data-depth="1" data-world="korea" data-chapter="cosmos"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>韩国神话 · 世界与核心观念</h1><h2>天与降临</h2><p>建国叙事常以天界来历赋予祖源意义，各王国的始祖与降临方式并不相同。</p><h2>山岳与神树</h2><p>山与树可成为神圣相遇的地点，其名称、象征及地方敬奉须放回具体语境。</p><h2>亡魂的旅途</h2><p>部分巫俗叙事关注亡者过渡与引导，相关仪式及神圣者的身份存在地域差异。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
