<body data-page="lesson" data-depth="1" data-world="christianity" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>基督教传统 · 全景导读</h1><p>基督教起源于公元一世纪的西亚，是延续至今的世界宗教。其核心是对独一上帝的信仰，以及围绕耶稣基督的道成肉身、受难与复活的救恩叙事。多数教会以三位一体理解上帝，而非信奉三位神。本页介绍公开的圣经叙事与传统，不将信仰主张简单视为虚构，也不代替教会教义或历史研究。</p><p>基督教是活态宗教。本页使用“经典叙事”而非以“神话”等同虚构。天主教、东正教及各新教传统存在差异；圣经叙事也与犹太教历史及经典紧密相连。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
