<body data-page="lesson" data-depth="1" data-world="yoruba" data-chapter="orientation"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="about-copy"><h1>约鲁巴神话 · 全景导读</h1><p>约鲁巴传统以奥里沙、祖先与人的关系理解世界，伊费具有重要的起源地位。诗歌、占卜与节庆保存多种叙事，西非各地及海外社群的实践各有历史，不能归为固定的单一神谱。</p><p>约鲁巴传统是活的宗教与文化传承。尼日利亚、贝宁及海外社群各有变化；奥里沙并非西式神谱的直接对应，伊法也不只是故事素材。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
