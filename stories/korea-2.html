<body data-page="article" data-depth="1" data-world="korea" data-story="1"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="article-body"><h1>巴里公主的归途</h1><p>遭遗弃的巴里在父母病危后踏上旅途，历经艰难取得救命之物；她的归来使被轻视的女儿成为救助者。</p><p>多个巫俗版本讲述巴里因是女儿而遭遗弃，后来由他人养大。父母病重时，曾被拒绝的孩子反而承担寻找救命之物的任务，独自走向遥远之地。</p><p>旅途中，她跨越人间边界，经历劳作、考验与相遇，最终取得救命之水或药物。所遇人物、服务年限及家庭关系，在各地讲唱中有明显差别。</p><p>巴里带回救助，部分版本又让她成为与亡魂旅程相关的神圣者。故事既呈现女性被排斥的处境，也以她的行动回应这种轻视，至今仍在传唱。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
