<body data-page="article" data-depth="1" data-world="aboriginal" data-story="0"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="article-body"><h1>班吉尔与生活之地</h1><p>部分库林公开叙事以班吉尔讲述土地与人的来历，创造不仅是过去的事件，也关联今日照护土地的责任。</p><p>在维多利亚部分库林社群公开分享的叙事中，班吉尔是重要的创造祖先，并与楔尾雕相连。土地与人的来历，由此进入具体地方的亲缘记忆。</p><p>这些公开讲述将创造与生活秩序相连：人在土地上生活，并不意味着可以任意占有和消耗。人与其他生命之间的关系，也带来持续的照护责任。</p><p>这里仅保留社群公开介绍的通识轮廓，不复述仪式或受限细节。理解故事仍须承认当地长者及知识持有者的权威，而非把它移作通用的神话。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
