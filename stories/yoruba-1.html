<body data-page="article" data-depth="1" data-world="yoruba" data-story="0"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="article-body"><h1>伊费的第一片土地</h1><p>神圣者把泥土撒向水面，鸟爪将其展开为陆地。伊费的来历有多种讲法，参与创世者并不一致。</p><p>一些约鲁巴起源叙事说，起初水面广阔，神圣者从上方带来泥土与禽鸟。泥土撒落水上，鸟用爪将它刨开，供人生活的大地于是逐渐展开。</p><p>伊费在这些讲述中成为重要的起源中心。然而带土下行者并不总是同一位：有些版本突出奥巴塔拉，另一些强调奥杜杜瓦及其建立秩序的作用。</p><p>这些差异联系着城市、王权与传承的历史，不宜删去异文而只留一条标准答案。泥土与鸟的行动，也让创造显现为多种生命共同参与的过程。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
