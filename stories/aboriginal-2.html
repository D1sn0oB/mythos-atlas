<body data-page="article" data-depth="1" data-world="aboriginal" data-story="1"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="article-body"><h1>水道中的祖先记忆</h1><p>一些公开叙事将蛇形祖先与水道、雨水和地貌联系起来；此处介绍共享主题，不拼造跨社群的统一故事。</p><p>在澳大利亚一些地区公开流传的叙事中，蛇形祖先的行进与河道、水潭及地形有关。水源因而不只是资源，也联系着地方的来历与生命秩序。</p><p>这样的存在有时滋养生命，也可能具有令人敬畏的力量。不同社群使用各自的名字，并以不同关系理解它，不能用一个译名抹平所有差异。</p><p>彩虹蛇是常见的外部概括，不是一部全国通用故事的主角。此处不提供具体地点的受限知识，也不将不同社群的情节拼成可任意传播的新传说。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
