<body data-page="article" data-depth="1" data-world="yoruba" data-story="1"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="article-body"><h1>不可缺少的奥舒恩</h1><p>一类叙事讲述其他奥里沙忽视奥舒恩，事业因而受阻；承认她的力量之后，生命与秩序才得以继续。</p><p>在一类广为讲述的故事里，众奥里沙来到世间安排事务，却将奥舒恩排除在协商之外。他们以为只凭自己的力量，便能使大地上的生活顺利展开。</p><p>然而工作接连受阻，丰饶也无法如愿到来。神圣的教导使众人明白，被忽视的奥舒恩并非可有可无，缺少她的参与，计划便无法真正完成。</p><p>众人终于请求奥舒恩加入，滋养与生机重新流动。版本对参与者及经过各有说明，但故事共同提醒听者，创造秩序不能依靠排斥与自满。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
