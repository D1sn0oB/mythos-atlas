<body data-page="article" data-depth="1" data-world="polynesia" data-story="1"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="article-body"><h1>毛伊钓起大鱼</h1><p>毛伊随兄长出海，钓起巨鱼；在毛利叙事中，大鱼联系北岛，其表面的起伏也获得故事性的解释。</p><p>毛伊设法随兄长出海，并用具有神圣来历的鱼钩垂钓。在一些毛利版本里，他以自己的血作饵，钩住深海中的巨大存在，奋力将它拉向水面。</p><p>浮起的大鱼后来与北岛相联系。毛伊要求兄长暂勿切割，自己先去完成必要事务，但兄长急于分取所得，鱼身因此留下沟壑与高低不平的痕迹。</p><p>故事把地貌与亲属间的行动连在一起。波利尼西亚其他岛屿也讲毛伊捕鱼，却有各自的岛名、工具与经过，不应把这些版本拼成同一张地图。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
