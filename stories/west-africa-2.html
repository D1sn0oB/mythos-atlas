<body data-page="article" data-depth="1" data-world="west-africa" data-story="1"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="article-body"><h1>装不住的智慧</h1><p>阿南西想把智慧藏在高树上，却被孩子指出更好的爬树办法；罐子破裂后，智慧散向众人。</p><p>阿南西把智慧收进罐子，打算独自保管。他寻找一棵高树，想把罐子藏到别人够不到的地方，却把它系在胸前，爬了许久也难以稳稳上升。</p><p>树下的孩子看见他的困境，提醒他把罐子移到背后。阿南西忽然发现，即使自称已经收齐智慧，自己仍不如一个孩子懂得眼前简单的办法。</p><p>在不同结尾里，罐子因愤怒或失手而破裂，智慧散入世界。故事以幽默拆穿独占知识的幻想，也让年幼者的观察成为值得认真倾听的声音。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
