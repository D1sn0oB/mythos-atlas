<body data-page="article" data-depth="1" data-world="korea" data-story="0"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="article-body"><h1>神树下的檀君祖源</h1><p>桓雄降世后，熊与虎请求成为人；熊坚持考验化为女子，后来生下檀君，为古朝鲜的起源赋予神圣来历。</p><p>《三国遗事》保存的叙事说，桓雄希望来到人间，便率随从降临神树之下。他管理风雨、农作及诸般事务，使人间秩序与天上的来处相连。</p><p>熊与虎请求成为人，得到遵守饮食与避光禁忌的考验。虎未能坚持，熊最终化为女子；故事借身体的改变，展开关于耐心、愿望与归属的想象。</p><p>熊女后来与桓雄结合，生下檀君，叙事将其与古朝鲜的建立相连。这是具有历史影响的祖源故事，不应将其中的纪年与情节直接视为考古事实。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
