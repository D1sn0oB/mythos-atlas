<body data-page="article" data-depth="1" data-world="polynesia" data-story="0"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="article-body"><h1>天地之间有了光</h1><p>在若干毛利传统里，天父与地母紧密相拥，塔内将双亲分开，为孩子们撑出有光的生活空间。</p><p>在若干毛利讲述中，天父兰吉努伊与地母帕帕图阿努库相拥，孩子们生活在两者之间的幽暗里。他们商议如何获得空间，也对办法产生分歧。</p><p>塔内终于以身体撑开双亲，使天空升高，让大地显露在光中。分离带来成长的空间，也带来悲伤，并不是一次毫无代价、人人赞同的胜利。</p><p>雨露与雾气在一些讲述中承载双亲的思念，亲缘也继续连接森林、海洋和人。不同部族保存自己的谱系与细节，不能以一版替代全部毛利传统。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
