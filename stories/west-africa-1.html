<body data-page="article" data-depth="1" data-world="west-africa" data-story="0"><a class="skip-link" href="#main">Skip to content / 跳至正文</a><canvas id="starfield" aria-hidden="true"></canvas><div class="wrap"><div id="header"></div><main id="main" tabindex="-1"><article class="article-body"><h1>向天神换取故事</h1><p>阿南西接受天神的艰难条件，用机智捕获强大的对手，最终取得故事，让讲述在人间流传。</p><p>一则阿坎故事说，世上的故事原由天神尼亚梅掌管。阿南西想取得讲述它们的权利，却被要求带来难以捕获的生灵，作为交换故事的代价。</p><p>面对强壮或危险的对手，阿南西没有依靠蛮力。他借测量、避雨等理由布下计策，让对方自行进入束缚；具体对象与捕捉方法随版本而变化。</p><p>条件终于完成，故事得以来到人间，并与阿南西的名字相连。这既赞美弱小者的机智，也给听者留下问题：聪明的手段是否总值得赞同呢。</p></article></main><div id="footer"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><noscript><div class="noscript">请启用 JavaScript 以浏览星图。Please enable JavaScript to explore the atlas.</div></noscript></body></html>
